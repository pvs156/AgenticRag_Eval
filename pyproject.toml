[project]
name = "dispute-assistant"
version = "0.1.0"
description = "Agentic RAG assistant for card/deposit dispute and scam triage, with evaluation-gated deployment"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "fastembed>=0.4",
  "qdrant-client>=1.12",
  "rank-bm25>=0.2",
  "langfuse>=3.0",
  "prometheus-client>=0.20",
  "langgraph>=0.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # deepeval needs click<8.4; newer huggingface-hub (fastembed dep) needs click>=8.4.2
  "huggingface-hub>=0.20,<1.0",
]

[project.optional-dependencies]
eval = [
  "deepeval>=4.0",
  "click>=8.0,<8.4",
]
dev = [
  "pytest>=8.2",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "dispute-assistant[eval]",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: needs internet access",
  "llm: needs a running LLM provider",
]
addopts = "-m 'not network and not llm'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Pull requests and pushes to main: lint, unit tests, front-end checks, image builds, and the eval gate.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

defaults:
  run:
    shell: bash  # bash -eo pipefail: a failing gate must fail the job even when piped through tee

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check app tests evals deploy && ruff format --check app tests evals deploy
      - name: Unit + API tests (no models, no network)
        run: pytest -q
      - name: Golden labels still agree with the rules engine
        run: python -m evals.datasets.build_golden && git diff --exit-code evals/datasets/golden.jsonl

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test -- --run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  eval-gate:
    # Runs the agent on the smoke suite and fails the build if quality regresses.
    # Uses a hosted LLM when LLM_API_KEY is configured, otherwise a small local model via Ollama ($0).
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_BASE_URL: ${{ secrets.LLM_API_KEY && vars.LLM_BASE_URL || 'http://localhost:11434/v1' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'ollama' }}
      LLM_MODEL: ${{ secrets.LLM_API_KEY && vars.LLM_MODEL || 'qwen2.5:1.5b' }}
      LLM_REASONING_EFFORT: ${{ secrets.LLM_API_KEY && '' || 'none' }}
      LLM_CACHE: "true"
      APP_ENV: ci
      HAS_KEY: ${{ secrets.LLM_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Cache models and LLM responses
        uses: actions/cache@v4
        with:
          path: .cache
          key: evalcache-${{ hashFiles('corpus/processed/manifest.json', 'app/agent/**', 'evals/datasets/golden.jsonl') }}
          restore-keys: evalcache-
      - name: Start Ollama (only without a hosted key)
        if: env.HAS_KEY != 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5 && ollama pull "$LLM_MODEL"
      - name: Run smoke eval
        run: python -m evals.run_eval --system agent --suite smoke --out evals/runs/ci.json
      - name: Gate
        run: python -m evals.gate evals/runs/ci.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "eval-run-${{ github.sha }}", path: evals/runs/ci.json }

  images:
    needs: [test, web, eval-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ env.OWNER }}/dispute-assistant-api:${{ github.sha }},ghcr.io/${{ env.OWNER }}/dispute-assistant-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ env.OWNER }}/dispute-assistant-web:${{ github.sha }},ghcr.io/${{ env.OWNER }}/dispute-assistant-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
